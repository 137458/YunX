name: Android CI

on:
  push:
    # 本仓库（137458/YunX）的默认分支是 main（上游 CYQawa/YunX 才是 master）：
    # 之前监听 master 导致 push 到 main 从不触发 CI，已修正。
    branches: [ "main" ]
    # paths 过滤：仅当构建相关文件变化时才触发，避免空跑 CI（workflow 自身必须在列表内，否则改它不触发）
    paths:
      - '.github/workflows/ci.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # CI访问阿里云镜像会 502：跳过国内镜像，直接走 Google/Maven Central 官方源
    env:
      YUNX_USE_MIRROR: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug
        run: ./gradlew assembleDebug  --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 静态分析基线：error 级问题直接红 CI（abortOnError 默认开启）。
      # 存量问题由 app/lint-baseline.xml 锁定，只拦新增问题。
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
