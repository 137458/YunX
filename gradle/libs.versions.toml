[versions]
# AGP 9.1：compose 1.12.x（miuix 0.9.4 的编译基线）在 AAR metadata 里强制要求 AGP ≥ 9.1.0（实测 ui/foundation 1.12.1 与
# material3-android 1.5.0-alpha26 的 minAndroidGradlePluginVersion 都是 9.1.0、minCompileSdk 都是 37），取 9.1 线最新 patch。
# AGP 9 默认启用 built-in Kotlin，本项目继续用外部 KGP（kotlin-android + compose/serialization 插件 + KSP），
# 由 gradle.properties 的 android.builtInKotlin=false 显式退出（AGP 9 官方过渡路径）。
agp = "9.1.1"
# miuix 0.9.4 由 Kotlin 2.4.20 编译发布（metadata 2.4），本项目用 2.3.21 消费：
# Kotlin 编译器允许读取 metadata 比自身新一个小版本的二进制（+1 窗口，2.3 读 2.4 合法），
# 选 2.3 线是为了与 KSP 2.3.12（基于 Kotlin 2.3.20 前端）同源，避免跳到 2.4 后 KSP 尚无对应版本。
kotlin = "2.3.21"
# kotlin-stdlib 统一约束到 2.4.20（miuix 0.9.4 的传递依赖要求）：运行时取最高版本，避免
# miuix / compose 1.12 在旧 stdlib 上缺方法；项目 Kotlin 2.3.21 编译器读 2.4 metadata 在官方 +1 兼容窗口内。
kotlinStdlib = "2.4.20"
coreKtx = "1.17.0"
webkit = "1.17.1"   # 登录 WebView：关闭 X-Requested-With + 同步桌面 client hints（UserAgentMetadata）
# androidx.lifecycle 全家桶统一取 2.9.2：runtime-ktx / viewmodel-ktx / viewmodel-compose 同组工件
# 按 androidx 约定应同版本发布，历史上 runtime 2.9.2 + viewmodel 2.8.7 的混搭纯属漂移。
lifecycle = "2.9.2"
activityCompose = "1.11.0"
okhttp = "4.12.0"
navigationevent = "1.1.2"   # 必须与 miuix 0.9.4 的 pom 对齐（它 requires navigationevent-compose 1.1.2），见下方依赖注释
# miuix 0.9.4 以 Compose Multiplatform 1.12.0 编译，BOM 2026.09.00 起内含 compose 1.12.1（runtime/ui/foundation），与之对齐
composeBom = "2026.09.00"
# 刻意覆盖 BOM 给的 material3 1.4.0（Expressive 的 ButtonGroup/LoadingIndicator/波浪进度条等组件只在 1.5.0-alpha）。
# 四条门槛核对结论（2026-10-10 由 alpha18 升到 alpha26，升 BOM 或该 alpha 前按 AGENTS.md §3.10 重核；①②③ 的数值都是从工件里读出来的实测值，不是文档转述）：
# ① Kotlin metadata：alpha26 的 pom 依赖 kotlin-stdlib 2.1.20（alpha18 同），项目 Kotlin 2.3.21 向后兼容可读；
# ② AAR 门槛：material3.aar 内 META-INF/com/android/build/gradle/aar-metadata.properties 写 minCompileSdk=37、
#    minAndroidGradlePluginVersion=9.1.0（alpha18 当年是 35 / 8.6.0），项目 compileSdk 37 + AGP 9.1.1 满足；
# ③ manifest minSdk=24（alpha18 / alpha22 是 23），与项目 minSdk 24 齐平；
# ④ compose 编译基线：alpha26 的 pom 依赖 ui/foundation/runtime 1.12.0-beta01，与 BOM 2026.09.00 强制的 1.12.1 同属 1.12 线。
#    升版就是因为 alpha18 的基线停在 1.11.0-beta02，而 compose 1.12.1 的 aar-metadata 要求 minCompileSdk=37 / AGP ≥ 9.1.0，
#    等于让 1.11 线编译的 material3 跑在 1.12 线上（混版，Expressive 组件运行时行为无人背书）。
material3Expressive = "1.5.0-alpha26"

# Room 2.7 起正式支持 KSP2（KSP 2.x 默认走 KSP2 处理器），2.6.1 只兼容 KSP1
room = "2.8.5"
ksp = "2.3.12"
material = "1.14.0"   # 官方 Material 主库，自带 com.google.android.material.color.utilities 包
# miuix 0.9.4（HyperOS Compose）：传递依赖 kotlin-stdlib 2.4.20 + CMP foundation 1.12.0（均由 Gradle 取最高版本解析）。
# 消费方真实门槛 = Kotlin metadata +1 窗口（2.3 读 2.4）、compose 运行时 ≥ 1.12（BOM 2026.09.00）、
# compose 1.12.x 强制 AGP ≥ 9.1、minSdk 24 —— 分别由 kotlin 2.3.21 / BOM / agp 9.1.1 / 项目 minSdk 满足。
miuix = "0.9.4"
kotlinx-serialization = "1.11.0"
markdownRenderer = "0.35.0"   # mikepenz/multiplatform-markdown-renderer（GFM 渲染；0.35.0 用 Kotlin 2.1.x 编译，2.3 读 2.1 metadata 向后兼容）

# 测试（测试框架不进 Compose BOM 管理，单独钉版）
junit = "4.13.2"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
# 原 material-color-utilities 坐标 (com.google.android.material:material-color-utilities:1.0.0) 在 Maven 上不存在。
# 官方 color.utilities 包就打包在下面这个主库里，import 无需改动。
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Miuix (HyperOS Compose)
miuix-ui-android = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-blur-android = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-preference-android = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-icons-android = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# 与 miuix 0.9.4 的 pom 对齐（requires navigationevent-compose 1.1.2）：Theme.kt 直接使用
# rememberNavigationEventDispatcherOwner，声明旧版本只是被 Gradle 取高版本兜住，写死旧版已成死钉。
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationevent" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }   # 版本说明见上方 material3Expressive
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
junit4 = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# GFM Markdown 渲染（Material3 变体，不含图片加载器；图片相对链接在渲染前预处理为绝对 URL）
markdownRenderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }