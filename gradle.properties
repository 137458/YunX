# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.nonTransitiveRClass=true
android.useAndroidX=true
# 允许项目路径包含非 ASCII 字符（本机路径为中文目录，仅本地构建用）
android.overridePathCheck=true
kotlin.code.style=official
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
org.gradle.caching=true

# AGP 9 默认启用 built-in Kotlin；本项目保留外部 KGP（compose/serialization/KSP 插件依赖 KGP 管线），显式退出
android.builtInKotlin=false
# 外部 KGP（org.jetbrains.kotlin.android）与 AGP 9 新 DSL 不兼容，保持老 DSL + KGP 管线；
# AGP 10 将移除该开关，届时需整体迁移 built-in Kotlin（compose/serialization/KSP 插件一并评估）
android.newDsl=false
